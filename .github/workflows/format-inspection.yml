name: format-inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: inspect
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - name: Emit gofmt diff
        run: gofmt -d . | tee "$RUNNER_TEMP/gofmt.diff"
      - name: Upload gofmt diff
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-diff
          path: ${{ runner.temp }}/gofmt.diff
